---
name: release
# release-ledger records its own releases.
on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: |
          name="release-ledger-${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="$name/" -o "$RUNNER_TEMP/$name.tar.gz" HEAD
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/$name.tar.gz" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # release-ledger has no dependencies, so its SBOM lists only itself.
      - name: SBOM
        env:
          REPO: ${{ github.repository }}
        run: |
          python3 - > "$RUNNER_TEMP/release-ledger.cdx.json" <<'PY'
          import json, os, uuid
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          purl = f"pkg:github/{os.environ['REPO']}@{os.environ['GITHUB_REF_NAME']}"
          print(json.dumps({
              "bomFormat": "CycloneDX",
              "specVersion": "1.6",
              "serialNumber": f"urn:uuid:{uuid.uuid4()}",
              "version": 1,
              "metadata": {"component": {
                  "type": "application", "name": "release-ledger", "version": ver,
                  "purl": purl, "licenses": [{"license": {"id": "Apache-2.0"}}]}},
              "components": [],
          }, indent=2))
          PY
      - uses: ./
        with:
          support-until: "2031-12-31"
          sbom: ${{ runner.temp }}/release-ledger.cdx.json
          subject-path: ${{ runner.temp }}/release-ledger-*.tar.gz
